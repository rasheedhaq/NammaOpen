<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123524" />
    <title>NammaOpen</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">Bengaluru pilot</p>
        <h1>Find out if the shop is actually open before you step out.</h1>
        <p class="lede">
          Search by shop name, UPI ID, or area. If a shop is closed, NammaOpen
          points you to the nearest live alternative.
        </p>
        <form id="search-form" class="search-panel">
          <input id="query" name="query" type="search" placeholder="Raju Tailor or rajutailor@upi" />
          <input id="pin" name="pin" type="text" inputmode="numeric" maxlength="6" placeholder="PIN code" />
          <button type="submit">Check now</button>
        </form>
        <button id="use-location" class="ghost-btn" type="button">Use my location</button>
      </section>

      <section id="spotlight" class="spotlight hidden"></section>

      <section class="results-wrap">
        <div class="section-head">
          <h2>Nearby results</h2>
          <p id="result-caption">Search for a tailor, salon, kirana, or any local shop.</p>
        </div>
        <div id="results" class="results-grid"></div>
      </section>
    </main>

    <template id="result-card-template">
      <article class="result-card">
        <div class="status-chip"></div>
        <h3></h3>
        <p class="meta"></p>
        <p class="addr"></p>
        <div class="actions">
          <a class="open-link" target="_self">View shop</a>
          <a class="call-link" target="_self">Call</a>
          <a class="wa-link" target="_blank">WhatsApp</a>
        </div>
      </article>
    </template>

    <script src="/static/app.js" defer></script>
  </body>
</html>
